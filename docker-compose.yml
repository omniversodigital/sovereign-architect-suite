services:
  # Open Policy Agent Engine Sidecar
  opa-engine:
    image: openpolicyagent/opa:latest
    container_name: sovereign-opa-sidecar
    command:
      - "run"
      - "--server"
      - "--log-level=info"
      - "--addr=:8181"
      - "/policies"
    volumes:
      - ./policy_engine:/policies:ro
    ports:
      - "8181:8181"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "opa", "version"]
      interval: 10s
      timeout: 5s
      retries: 3

  # High-Throughput In-Memory Telemetry Cache
  telemetry-cache:
    image: redis:7-alpine
    container_name: sovereign-redis-telemetry
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --save "" --appendonly no

networks:
  default:
    name: sovereign-mesh
