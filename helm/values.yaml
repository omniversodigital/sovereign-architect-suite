replicaCount: 2

image:
  gateway:
    repository: sovereign/gateway
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  opa:
    repository: openpolicyagent/opa
    tag: "latest"
    pullPolicy: IfNotPresent
  redis:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

service:
  type: ClusterIP
  gatewayPort: 8080
  opaPort: 8181
  redisPort: 6379

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
